    description = "Les anneaux de lumiere : de quel cote vient la clarte, en seize directions"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.full.BrightRingsCheck'
    systemProperty 'ab3d2.media', mediaRoot.absolutePath
    systemProperty 'ab3d2.data', new File(projectDir, 'data').absolutePath
    systemProperty 'ab3d2.brightrings', new File(refRoot, 'brightrings.json').absolutePath
}

tasks.register('modelPointsCheck', JavaExec) {
    group = 'verification'
    description = "Les points d'un modele : grille d'eclairage, rotation, projection, luminosite"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.full.ModelPointsCheck'
    maxHeapSize = '6g'
