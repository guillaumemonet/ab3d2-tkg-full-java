plugins {
    id 'java'
}

group = 'ab3d2'
version = '0.0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson ne sert QU'A l'outil de validation (il relit le corpus de reference, qui est du
    // JSON). Le moteur lui-meme n'a aucune dependance.
    implementation 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    main {
        java { srcDirs = ['src'] }
        resources { srcDirs = [] }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Xlint:-serial'
}

/** Racine des donnees d'origine depackees (medias/original), cherchee en remontant. */
def mediaRoot = {
    def d = projectDir
    while (d != null) {
        def c = new File(d, 'medias/original')
        if (c.isDirectory()) { return c }
        d = d.parentFile
    }
    return new File(projectDir, 'medias/original')
}()

/**
 * Le corpus de reference, produit par le remake : on le cherche en remontant, pour que ce
 * projet puisse vivre n'importe ou dans l'arborescence.
 */
def refRoot = {
    def d = projectDir
    while (d != null) {
        def c = new File(d, 'rebirth/assets')
        if (new File(c, 'glf.json').isFile()) { return c }
        d = d.parentFile
    }
    return new File(projectDir, 'rebirth/assets')
}()

tasks.register('levelCheck', JavaExec) {
    group = 'verification'
    description = "Lit les 16 niveaux SANS memoire plate et compare au corpus de reference"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.full.LevelCheck'
    systemProperty 'ab3d2.media', mediaRoot.absolutePath
    def ref = new File(refRoot, 'levels')
    systemProperty 'ab3d2.ref', ref.absolutePath
}

tasks.register('defsCheck', JavaExec) {
    group = 'verification'
    description = "Lit la base GLF (test.lnk) SANS memoire plate et compare au corpus de reference"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.full.DefsCheck'
    systemProperty 'ab3d2.media', mediaRoot.absolutePath
    def glf = new File(refRoot, 'glf.json')
    systemProperty 'ab3d2.glf', glf.absolutePath
}

/** Les trois harnais sans affichage de la simulation. */
['moveTest': 'ab3d2.full.sim.MoveTest',
 'alienTest': 'ab3d2.full.sim.AlienTest',
 'shotTest': 'ab3d2.full.sim.ShotTest'].each { nom, classe ->
    tasks.register(nom, JavaExec) {
        group = 'verification'
        description = "Simulation sans affichage : $nom (-Plevel=a, ou all)"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = classe
        systemProperty 'ab3d2.media', mediaRoot.absolutePath
        systemProperty 'ab3d2.data', new File(projectDir, 'data').absolutePath
        systemProperty 'rebirth.level', project.findProperty('level') ?: 'all'
    }
}

tasks.register('worldTest', JavaExec) {
    group = 'verification'
    description = "La boucle de jeu entiere, sans fenetre (-Plevel=a, ou all)"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.full.sim.WorldTest'
    systemProperty 'ab3d2.media', mediaRoot.absolutePath
    systemProperty 'ab3d2.data', new File(projectDir, 'data').absolutePath
    systemProperty 'ab3d2.level', project.findProperty('level') ?: 'all'
}

tasks.register('play', JavaExec) {
    group = 'application'
    description = "Joue un niveau, vu de dessus (-Plevel=a)"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.full.view.Play'
    systemProperty 'ab3d2.media', mediaRoot.absolutePath
    systemProperty 'ab3d2.data', new File(projectDir, 'data').absolutePath
    systemProperty 'ab3d2.level', project.findProperty('level') ?: 'a'
}

tasks.register('checkAll') {
    group = 'verification'
    description = "Toutes les verifications contre le corpus de reference"
    dependsOn 'levelCheck', 'defsCheck', 'moveTest', 'alienTest', 'shotTest', 'worldTest'
}
